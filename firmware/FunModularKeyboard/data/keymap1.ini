[key_mapping]
; 格式说明:
; 普通按键: 使用可读键名; 单键示例: 1=A；组合键示例: 2=LCtrl+LShift+A
; 自定义功能按键: 使用 KEY_ 开头的功能名; 与普通键/修饰键配置互斥
1=KEY_MEDIA_PREVIOUS_TRACK
2=KEY_MEDIA_NEXT_TRACK
3=KEY_MEDIA_STOP
4=KEY_MEDIA_VOLUME_UP
5=KEY_MEDIA_VOLUME_DOWN
6=A
7=B
8=C
9=KEY_MEDIA_MUTE
10=
11=
12=
13=
14=
15=Delete
16=KEY_MEDIA_PLAY_PAUSE

